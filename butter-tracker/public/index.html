  .tab-btn:hover { background: var(--bg); color: var(--text); }
  .tab-btn.active { background: var(--primary); color: white; }

  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }

  .card-grid-4 { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
  .stat-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; border-left: 4px solid var(--primary-light); }
  .stat-card.green { border-left-color: var(--success); }
  .stat-card.purple { border-left-color: var(--purple); }
  .stat-card.orange { border-left-color: var(--warn); }
  .stat-title { font-size: 12px; color: var(--text-muted); }
  .stat-value { font-size: 1.8rem; font-weight: 700; margin: 4px 0; }
  .stat-sub { font-size: 11px; color: var(--text-muted); }

  /* Table */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: white; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  thead { background: #f8fafc; }
  th { padding: 10px 12px; text-align: left; font-weight: 600; color: var(--text-muted); white-space: nowrap; font-size: 12px; border-bottom: 1px solid var(--border); }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f8fafc; }
  .td-right { text-align: right; }
  .td-center { text-align: center; }

  /* Stage badges */
  .stage-badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; color: white; white-space: nowrap; display: inline-block; }

  /* Risk badge */
  .risk-badge { font-size: 11px; color: var(--danger); }

  /* Filters */
  .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .filter-bar input, .filter-bar select { border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 13px; background: white; }
  .filter-count { font-size: 13px; color: var(--text-muted); }

  /* Forms */
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group label { font-size: 11px; color: var(--text-muted); font-weight: 500; }
  .form-group input, .form-group select, .form-group textarea { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px; background: white; width: 100%; }

  /* Buttons */
  .btn { border: none; border-radius: 8px; padding: 8px 18px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; display: inline-flex; align-items: center; gap: 6px; }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: #1e3a8a; }
  .btn-success { background: var(--success); color: white; }
  .btn-success:hover { background: #047857; }
  .btn-warn { background: var(--warn); color: white; }
  .btn-danger { background: var(--danger); color: white; }
  .btn-ghost { background: var(--bg); color: var(--text-muted); }
  .btn-sm { padding: 4px 10px; font-size: 12px; }

  /* Progress toggle */
  .progress-btn { font-size: 12px; padding: 4px 10px; border-radius: 20px; border: none; cursor: pointer; font-weight: 500; transition: all .15s; }
  .progress-btn.done { background: var(--success-pale); color: var(--success); }
  .progress-btn.pending { background: #f1f5f9; color: var(--text-muted); }

  .progress-card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

  /* Chart container */
  .chart-wrap { position: relative; height: 260px; }

  .rank-gold td { background: #fffbeb; }
  .rank-silver td { background: #f8fafc; }
  .rank-bronze td { background: #fff7ed; }

  /* Toast */
  #toast { position: fixed; bottom: 24px; right: 24px; background: #1e293b; color: white; padding: 10px 18px; border-radius: 10px; font-size: 13px; z-index: 1000; opacity: 0; transform: translateY(10px); transition: all .3s; pointer-events: none; }

  /* Section title */
  .section-title { font-weight: 700; font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

  /* Risk overview */
  .risk-box { background: #fef2f2; border-radius: 10px; padding: 12px; text-align: center; }

  .risk-box .risk-label { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

  /* Space util */
  .space-y > * + * { margin-top: 12px; }
  .mt-4 { margin-top: 16px; }
  .mb-4 { margin-bottom: 16px; }

    .tab-btn { font-size: 12px; padding: 6px 10px; }
    .stat-value { font-size: 1.4rem; }

</style>

const API = "/api/data";

async function loadFromCloud() {
  try {
    const r = await fetch(API);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    if (data.clients && data.clients.length > 0) {
      clients = data.clients;
    }
    if (data.deals && data.deals.length > 0) {
      deals = data.deals;
    }
    if (data.lastUpdated) {
      const d = new Date(data.lastUpdated);
      setSyncStatus("saved","✓ 最後同步：" + d.toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}));
    }
    return true;
  } catch(e) {
    // Fallback to localStorage
    const lsClients = localStorage.getItem("butter_clients");
    const lsDeals = localStorage.getItem("butter_deals");
    if (lsClients) clients = JSON.parse(lsClients);
    if (lsDeals) deals = JSON.parse(lsDeals);
    setSyncStatus("","⚠️ 離線模式（資料儲存於本機）");
    return false;
  }
}

async function saveAll() {
  setSyncStatus("saving","💾 儲存中...");
  try {
    const r = await fetch(API+"?action=saveAll", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({clients,deals})
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    setSyncStatus("saved","✓ 已儲存至雲端 " + now());
    toast("✅ 資料已儲存至雲端！");
  } catch(e) {
    // Fallback to localStorage
    localStorage.setItem("butter_clients", JSON.stringify(clients));
    localStorage.setItem("butter_deals", JSON.stringify(deals));
    setSyncStatus("","💾 已儲存於本機（離線）");
    toast("⚠️ 雲端儲存失敗，已存於本機");
  }
}

function autoSave() {
  // Save to localStorage immediately as backup
  localStorage.setItem("butter_clients", JSON.stringify(clients));
  localStorage.setItem("butter_deals", JSON.stringify(deals));
  setSyncStatus("saving","● 有未儲存變更");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveAll, 3000); // Auto-save after 3 seconds
}

function switchTab(key) {
  currentTab = key;
  document.querySelectorAll(".tab-btn").forEach((b,i) => {
    b.className = "tab-btn" + (TABS[i].key === key ? " active" : "");
  });
  // Destroy charts before re-render
  Object.values(charts).forEach(c => c.destroy());
  charts = {};
  renderTab();
}

// ═══════════════════════════════════════════════════════
// COMPUTED STATS
// ═══════════════════════════════════════════════════════
function getStats() {
  const totalDealBoxes = deals.reduce((s,d) => s+(d.boxes||0), 0);
  const closedClients = clients.filter(c => c.stage==="累計成交").length;
  const totalMonthVol = clients.reduce((s,c) => s+(c.monthVol||0), 0);
  const totalPlanVol = clients.reduce((s,c) => s+(c.planVol||0), 0);
  const stageData = STAGES.map(st => ({name:st, value:clients.filter(c=>c.stage===st).length}));
  const regionData = REGIONS.map(r => {
    const rc = clients.filter(c=>getRegion(c.sales)===r);
    return {name:r, clients:rc.length, closed:rc.filter(c=>c.stage==="累計成交").length, boxes:deals.filter(d=>getRegion(d.sales)===r).reduce((s,d)=>s+(d.boxes||0),0)};
  });
  const brandCount = {}; clients.forEach(c => {brandCount[c.brand]=(brandCount[c.brand]||0)+1;});
  const brandData = Object.entries(brandCount).sort((a,b)=>b[1]-a[1]).map(([name,value])=>({name,value}));
  const typeCount = {}; clients.forEach(c => {typeCount[c.clientType]=(typeCount[c.clientType]||0)+1;});
  const typeData = Object.entries(typeCount).sort((a,b)=>b[1]-a[1]).map(([name,value])=>({name,value}));
  const riskCount = {}; clients.forEach(c => {if(c.risk!=="無") riskCount[c.risk]=(riskCount[c.risk]||0)+1;});
  const riskData = Object.entries(riskCount).sort((a,b)=>b[1]-a[1]).map(([name,value])=>({name,value}));
  const prodCount = {}; deals.forEach(d => {prodCount[d.product]=(prodCount[d.product]||0)+d.boxes;});
  const prodData = Object.entries(prodCount).sort((a,b)=>b[1]-a[1]).map(([name,value])=>({name,value}));
  const salesRank = SALES_META.map(s => {
    const sc = clients.filter(c=>c.sales===s.name);
    const sd = deals.filter(d=>d.sales===s.name);
    return {name:s.name,region:s.region,clients:sc.length,closed:sc.filter(c=>c.stage==="累計成交").length,boxes:sd.reduce((sum,d)=>sum+(d.boxes||0),0),monthVol:sc.reduce((sum,c)=>sum+(c.monthVol||0),0)};
  }).sort((a,b)=>b.boxes-a.boxes);
  return {totalDealBoxes,closedClients,totalMonthVol,totalPlanVol,stageData,regionData,brandData,typeData,riskData,prodData,salesRank};
}

}

function renderClients() {
  const fc = clients.filter(c => {
    if(clientFilters.sales && c.sales!==clientFilters.sales) return false;
    if(clientFilters.region && getRegion(c.sales)!==clientFilters.region) return false;
    if(clientFilters.stage && c.stage!==clientFilters.stage) return false;
    if(clientFilters.type && c.clientType!==clientFilters.type) return false;
    if(clientFilters.search && !c.client.includes(clientFilters.search) && !c.notes.includes(clientFilters.search)) return false;
    return true;
  });
  return `
  <div class="filter-bar">
    <input placeholder="🔍 搜尋客戶/備註" value="${clientFilters.search}" oninput="clientFilters.search=this.value;renderTab()" style="min-width:140px">
    <select onchange="clientFilters.region=this.value;renderTab()">
      <option value="">全區域</option>${REGIONS.map(r=>`<option${clientFilters.region===r?" selected":""}>${r}</option>`).join("")}
    </select>
    <select onchange="clientFilters.sales=this.value;renderTab()">
      <option value="">全業務</option>${SALES_META.map(s=>`<option${clientFilters.sales===s.name?" selected":""}>${s.name}</option>`).join("")}
    </select>
    <select onchange="clientFilters.stage=this.value;renderTab()">
      <option value="">全階段</option>${STAGES.map(s=>`<option${clientFilters.stage===s?" selected":""}>${s}</option>`).join("")}
    </select>
    <select onchange="clientFilters.type=this.value;renderTab()">
      <option value="">全類型</option>${CLIENT_TYPES.map(t=>`<option${clientFilters.type===t?" selected":""}>${t}</option>`).join("")}
    </select>
    <span class="filter-count">共 ${fc.length} 筆</span>
  </div>
  <div class="table-wrap">
  <table><thead><tr>${["業務","區域","客戶","類型","競品","進價","月均量","計畫量","階段","風險","備註"].map(h=>`<th>${h}</th>`).join("")}</tr></thead>
  <tbody>${fc.map(c=>`<tr>
    <td>${c.sales||"-"}</td><td>${getRegion(c.sales)||"-"}</td>
    <td><strong>${c.client}</strong></td><td>${c.clientType}</td><td>${c.brand}</td>
    <td class="td-right">${c.price?fmt(c.price):"-"}</td>
    <td class="td-right">${fmt(c.monthVol)}</td><td class="td-right">${fmt(c.planVol)}</td>
    <td><span class="stage-badge" style="background:${STAGE_COLORS[c.stage]}">${c.stage}</span></td>
    <td class="risk-badge">${c.risk!=="無"?c.risk:""}</td>
    <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:#64748b">${c.notes}</td>
  </tr>`).join("")}</tbody></table></div>`;
}
function bindClientEvents(){}

// ─── Deals ───
let dealFilterSales = "";
function renderDeals() {
  const fd = dealFilterSales ? deals.filter(d=>d.sales===dealFilterSales) : deals;
  const total = fd.reduce((s,d)=>s+d.boxes,0);
  return `
  <div class="filter-bar">
    <select onchange="dealFilterSales=this.value;renderTab()">
      <option value="">全業務</option>${SALES_META.map(s=>`<option${dealFilterSales===s.name?" selected":""}>${s.name}</option>`).join("")}
    </select>
    <span class="filter-count">共 ${fd.length} 筆，合計 <strong>${fmt(total)}</strong> 箱</span>
  </div>
  <div class="table-wrap">
  <table><thead><tr>${["業務","區域","客戶","箱數","產品","單價","合約","日期","備註",""].map(h=>`<th>${h}</th>`).join("")}</tr></thead>
  <tbody>${fd.map(d=>`<tr>
    <td>${d.sales}</td><td>${getRegion(d.sales)}</td><td><strong>${d.client}</strong></td>
    <td class="td-right" style="color:var(--success);font-weight:700">${fmt(d.boxes)}</td>
    <td>${d.product}</td><td class="td-right">${d.price?fmt(d.price):"-"}</td>
    <td>${d.contract}</td><td>${d.date}</td>
    <td style="font-size:12px;color:#64748b">${d.notes}</td>
    <td><button class="btn btn-sm btn-danger" onclick="deleteDeal(${d.id})">刪除</button></td>
  </tr>`).join("")}</tbody></table></div>`;
}
function deleteDeal(id) {
  if(!confirm("確定刪除此成交紀錄？")) return;
  deals = deals.filter(d=>d.id!==id);
  autoSave(); renderTab(); toast("已刪除成交紀錄");
}
function bindDealEvents(){}

// ─── Progress Update ───
let updateFilter = "";
function renderUpdate() {
  // Default to current identity if set
  const filter = updateFilter || currentIdentity || "";
  const uf = filter ? clients.filter(c=>c.sales===filter) : clients;
  return `
  <div class="filter-bar mb-4">
    <select onchange="updateFilter=this.value;renderTab()">
      <option value="">全業務</option>${SALES_META.map(s=>`<option${filter===s.name?" selected":""}>${s.name}</option>`).join("")}
    </select>
    <span class="filter-count">共 ${uf.length} 筆</span>
    ${currentIdentity?`<span style="font-size:12px;color:var(--primary)">📌 已選擇身份：${currentIdentity}（可切換至全業務查看）</span>`:""}
  </div>
  <div class="space-y">
  ${uf.map(c=>`
    <div class="progress-card" data-id="${c.id}">
      <div class="client-info">
        <div class="client-name">${c.client} <span style="font-size:11px;color:#94a3b8">(${c.sales||"未指定"} · ${getRegion(c.sales)||"-"})</span></div>
        <div class="client-meta">📦 月均 ${fmt(c.monthVol)} 箱 ｜ ${c.clientType} ｜ ${c.brand}</div>
        <div class="client-notes">📝 ${c.notes||"（無備註）"}</div>
      </div>
      <select class="stage-sel" data-id="${c.id}">
        ${STAGES.map(s=>`<option${c.stage===s?" selected":""}>${s}</option>`).join("")}
      </select>
      <select class="risk-sel" data-id="${c.id}" style="font-size:11px">
        ${RISK_TAGS.map(r=>`<option${c.risk===r?" selected":""}>${r}</option>`).join("")}
      </select>
      <button class="progress-btn ${c.progress?"done":"pending"}" data-id="${c.id}">
        ${c.progress?"✅ 本週有進展":"⬜ 未更新"}
      </button>
      <button class="btn btn-sm btn-ghost" onclick="openNoteEdit(${c.id})" title="編輯備註">✏️</button>
    </div>
    <div id="note-edit-${c.id}" style="display:none;background:#f8fafc;border-radius:8px;padding:10px;margin-top:-8px;margin-bottom:4px">
      <label style="font-size:12px;color:#64748b">備註：</label>
      <div style="display:flex;gap:8px;margin-top:4px">
        <input class="notes-edit" id="note-input-${c.id}" value="${c.notes||""}" placeholder="輸入備註..." style="flex:1">
        <button class="btn btn-sm btn-primary" onclick="saveNote(${c.id})">儲存</button>
        <button class="btn btn-sm btn-ghost" onclick="document.getElementById('note-edit-${c.id}').style.display='none'">取消</button>
      </div>
    </div>
  `).join("")}
  </div>`;
}

function openNoteEdit(id) {
  const el = document.getElementById("note-edit-"+id);
  el.style.display = el.style.display==="none" ? "block" : "none";
}
function saveNote(id) {
  const val = document.getElementById("note-input-"+id).value;
  const c = clients.find(c=>c.id===id);
  if(c){ c.notes = val; autoSave(); toast("備註已儲存"); renderTab(); }
}

function bindUpdateEvents() {
  document.querySelectorAll(".stage-sel").forEach(sel => {
    sel.addEventListener("change", e => {
      const id = Number(e.target.dataset.id);
      const c = clients.find(c=>c.id===id);
      if(c){ c.stage = e.target.value; autoSave(); toast("階段已更新：" + c.client); }
    });
  });
  document.querySelectorAll(".risk-sel").forEach(sel => {
    sel.addEventListener("change", e => {
      const id = Number(e.target.dataset.id);
      const c = clients.find(c=>c.id===id);
      if(c){ c.risk = e.target.value; autoSave(); toast("風險已更新：" + c.client); }
    });
  });
  document.querySelectorAll(".progress-btn").forEach(btn => {
    btn.addEventListener("click", e => {
      const id = Number(e.target.dataset.id);
      const c = clients.find(c=>c.id===id);
      if(c){ c.progress = !c.progress; autoSave(); renderTab(); }
    });
  });
}

// ─── Add Client ───
let newClientForm = {sales:SALES_META[0].name,client:"",clientType:CLIENT_TYPES[0],brand:BRANDS[0],price:"",monthVol:"",planVol:"",stage:STAGES[0],risk:RISK_TAGS[0],notes:""};
function renderAddClient() {
  return `
  <div class="card" style="max-width:700px;margin:0 auto">
    <div class="section-title">➕ 新增客戶</div>
    <div class="form-grid">
      <div class="form-group"><label>業務員</label><select id="nc-sales">
        ${SALES_META.map(s=>`<option${newClientForm.sales===s.name?" selected":""}>${s.name}</option>`).join("")}
      </select></div>
      <div class="form-group"><label>客戶名稱 *</label><input id="nc-client" value="${newClientForm.client}" placeholder="必填"></div>
      <div class="form-group"><label>客戶類型</label><select id="nc-type">
        ${CLIENT_TYPES.map(t=>`<option${newClientForm.clientType===t?" selected":""}>${t}</option>`).join("")}
      </select></div>
      <div class="form-group"><label>目前使用品牌</label><select id="nc-brand">
        ${BRANDS.map(b=>`<option${newClientForm.brand===b?" selected":""}>${b}</option>`).join("")}
      </select></div>
      <div class="form-group"><label>目前進價</label><input type="number" id="nc-price" value="${newClientForm.price}" placeholder="選填"></div>
      <div class="form-group"><label>月均量(箱)</label><input type="number" id="nc-mvol" value="${newClientForm.monthVol}" placeholder="選填"></div>
      <div class="form-group"><label>計畫銷售量(箱)</label><input type="number" id="nc-pvol" value="${newClientForm.planVol}" placeholder="選填"></div>
      <div class="form-group"><label>階段</label><select id="nc-stage">
        ${STAGES.map(s=>`<option${newClientForm.stage===s?" selected":""}>${s}</option>`).join("")}
      </select></div>
      <div class="form-group"><label>風險標記</label><select id="nc-risk">
        ${RISK_TAGS.map(r=>`<option${newClientForm.risk===r?" selected":""}>${r}</option>`).join("")}
      </select></div>
      <div class="form-group" style="grid-column:1/-1"><label>備註</label><textarea id="nc-notes">${newClientForm.notes}</textarea></div>
    </div>
    <div class="mt-4">
      <button class="btn btn-primary" onclick="submitAddClient()">➕ 新增客戶</button>
    </div>
  </div>`;
}
function submitAddClient() {
  const name = document.getElementById("nc-client").value.trim();
  if(!name){ toast("❌ 請填寫客戶名稱"); return; }
  const price = document.getElementById("nc-price").value;
  const mvol = document.getElementById("nc-mvol").value;
  const pvol = document.getElementById("nc-pvol").value;
  clients.push({
    id: Date.now(),
    sales: document.getElementById("nc-sales").value,
    client: name,
    clientType: document.getElementById("nc-type").value,
    brand: document.getElementById("nc-brand").value,
    price: price ? Number(price) : null,
    monthVol: mvol ? Number(mvol) : null,
    planVol: pvol ? Number(pvol) : null,
    stage: document.getElementById("nc-stage").value,
    risk: document.getElementById("nc-risk").value,
    notes: document.getElementById("nc-notes").value,
    progress: false, comments: []
  });
  newClientForm = {sales:SALES_META[0].name,client:"",clientType:CLIENT_TYPES[0],brand:BRANDS[0],price:"",monthVol:"",planVol:"",stage:STAGES[0],risk:RISK_TAGS[0],notes:""};
  autoSave(); toast("✅ 客戶已新增！"); renderTab();
}

// ─── Add Deal ───
let newDealForm = {sales:SALES_META[0].name,client:"",boxes:"",product:PRODUCTS[0],price:"",contract:CONTRACT_TYPES[0],date:"",notes:""};
function renderAddDeal() {
  const today = new Date().toISOString().slice(0,7).replace("-","/");
  return `
  <div class="card" style="max-width:700px;margin:0 auto">
    <div class="section-title">➕ 新增成交紀錄</div>
    <div class="form-grid">
      <div class="form-group"><label>業務員</label><select id="nd-sales">
        ${SALES_META.map(s=>`<option${newDealForm.sales===s.name?" selected":""}>${s.name}</option>`).join("")}
      </select></div>
      <div class="form-group"><label>客戶名稱 *</label>
        <input id="nd-client" value="${newDealForm.client}" placeholder="必填" list="client-list">
        <datalist id="client-list">${clients.map(c=>`<option value="${c.client}">`).join("")}</datalist>
      </div>
      <div class="form-group"><label>箱數 *</label><input type="number" id="nd-boxes" value="${newDealForm.boxes}" placeholder="必填"></div>
      <div class="form-group"><label>產品</label><select id="nd-product">
        ${PRODUCTS.map(p=>`<option${newDealForm.product===p?" selected":""}>${p}</option>`).join("")}
      </select></div>
      <div class="form-group"><label>單價</label><input type="number" id="nd-price" value="${newDealForm.price}" placeholder="選填"></div>
      <div class="form-group"><label>合約類型</label><select id="nd-contract">
        ${CONTRACT_TYPES.map(c=>`<option${newDealForm.contract===c?" selected":""}>${c}</option>`).join("")}
      </select></div>
      <div class="form-group"><label>日期</label><input id="nd-date" value="${newDealForm.date||today}" placeholder="2026/04/10"></div>
      <div class="form-group"><label>備註</label><input id="nd-notes" value="${newDealForm.notes}"></div>
    </div>
    <div class="mt-4">
      <button class="btn btn-success" onclick="submitAddDeal()">➕ 新增成交</button>
    </div>
  </div>`;
}
function submitAddDeal() {
  const client = document.getElementById("nd-client").value.trim();
  const boxes = document.getElementById("nd-boxes").value;
  if(!client || !boxes){ toast("❌ 請填寫客戶名稱與箱數"); return; }
  const price = document.getElementById("nd-price").value;
  deals.push({
    id: Date.now(),
    sales: document.getElementById("nd-sales").value,
    client, boxes: Number(boxes),
    product: document.getElementById("nd-product").value,
    price: price ? Number(price) : null,
    contract: document.getElementById("nd-contract").value,
    date: document.getElementById("nd-date").value,
    notes: document.getElementById("nd-notes").value,
  });
  newDealForm = {sales:SALES_META[0].name,client:"",boxes:"",product:PRODUCTS[0],price:"",contract:CONTRACT_TYPES[0],date:"",notes:""};
  autoSave(); toast("✅ 成交紀錄已新增！"); renderTab();
}

// ─── Ranking ───
function renderRanking(stats) {
  const rankClass = i => i===0?"rank-gold":i===1?"rank-silver":i===2?"rank-bronze":"";
  const rankIcon = i => i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1;
  return `
  <div class="card mb-4">
    <div class="section-title">🏆 業務員排行榜（依已進貨箱數）</div>
    <div class="table-wrap"><table><thead><tr>
      ${["排名","業務員","區域","客戶數","成交數","已進貨(箱)","客戶月均量"].map(h=>`<th>${h}</th>`).join("")}
    </tr></thead><tbody>
    ${stats.salesRank.map((s,i)=>`<tr class="${rankClass(i)}">
      <td class="td-center" style="font-size:1.2rem">${rankIcon(i)}</td>
      <td><strong>${s.name}</strong></td><td>${s.region}</td>
      <td class="td-center">${s.clients}</td><td class="td-center">${s.closed}</td>
      <td class="td-right" style="font-weight:700;color:var(--success)">${fmt(s.boxes)}</td>
      <td class="td-right">${fmt(s.monthVol)}</td>
    </tr>`).join("")}
    </tbody></table></div>
  </div>
  <div class="card">
    <div class="section-title">📊 業務員進貨箱數</div>
    <div class="chart-wrap" style="height:320px"><canvas id="chart-rank"></canvas></div>
  </div>`;
}
function initRankingChart(stats) {
  const data = stats.salesRank.filter(s=>s.boxes>0);
  charts.rank = new Chart(document.getElementById("chart-rank"), {
    type:"bar", data:{
      labels:data.map(s=>s.name),
      datasets:[{label:"已進貨(箱)",data:data.map(s=>s.boxes),backgroundColor:PIE_COLORS}]
    }, options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}
  });
}

// ─── Trend ───
function renderTrend(stats) {
  return `
  <div class="card-grid card-grid-2">
    <div class="card"><div class="section-title">🏢 客戶類型分佈</div><div class="chart-wrap"><canvas id="chart-type"></canvas></div></div>
    <div class="card"><div class="section-title">🏷️ 競品品牌市佔(客戶數)</div><div class="chart-wrap"><canvas id="chart-brand2"></canvas></div></div>
    <div class="card"><div class="section-title">📊 各區域階段分佈</div><div class="chart-wrap"><canvas id="chart-region2"></canvas></div></div>
    <div class="card"><div class="section-title">💰 各業務進貨產品明細</div><div class="chart-wrap"><canvas id="chart-prod2"></canvas></div></div>
  </div>`;
}
function initTrendCharts(stats) {
  charts.type = new Chart(document.getElementById("chart-type"),{
    type:"pie",data:{labels:stats.typeData.map(d=>d.name),datasets:[{data:stats.typeData.map(d=>d.value),backgroundColor:PIE_COLORS}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{font:{size:11}}}}}
  });
  charts.brand2 = new Chart(document.getElementById("chart-brand2"),{
    type:"bar",data:{labels:stats.brandData.map(d=>d.name),datasets:[{label:"客戶數",data:stats.brandData.map(d=>d.value),backgroundColor:"#8b5cf6"}]},
    options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}
  });
  // Region-stage stacked
  const regionStage = REGIONS.map(r=>{
    const rc = clients.filter(c=>getRegion(c.sales)===r);
    const obj={name:r};
    STAGES.forEach(st=>{obj[st]=rc.filter(c=>c.stage===st).length;});
    return obj;
  });
  charts.region2 = new Chart(document.getElementById("chart-region2"),{
    type:"bar",
    data:{labels:REGIONS,datasets:STAGES.map((st,i)=>({label:st,data:regionStage.map(r=>r[st]),backgroundColor:STAGE_COLORS[st],stack:"a"}))},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{font:{size:11}}}}}
  });
  // Sales-product stacked
  const sp = SALES_META.map(s=>{
    const sd = deals.filter(d=>d.sales===s.name);
    const obj={name:s.name};
    PRODUCTS.forEach(p=>{obj[p]=sd.filter(d=>d.product===p).reduce((sum,d)=>sum+d.boxes,0);});
    return obj;
  }).filter(d=>PRODUCTS.some(p=>d[p]>0));
  charts.prod2 = new Chart(document.getElementById("chart-prod2"),{
    type:"bar",
    data:{labels:sp.map(d=>d.name),datasets:PRODUCTS.map((p,i)=>({label:p,data:sp.map(d=>d[p]),backgroundColor:PIE_COLORS[i%PIE_COLORS.length],stack:"a"}))},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{font:{size:10}}}}}
  });
}

// ─── Export ───
function exportData() {
  const data = {exportTime:new Date().toISOString(),clients,deals};
  const blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "butter-tracker-" + new Date().toISOString().slice(0,10) + ".json";
  a.click();
  toast("📤 資料已匯出！");
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
async function init() {
  document.getElementById("loading").classList.remove("hidden");
  initTabs();
  initIdentity();
  await loadFromCloud();
  document.getElementById("loading").classList.add("hidden");
  renderTab();
}

init();
</script>
